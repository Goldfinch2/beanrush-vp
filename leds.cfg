# Bean Rush: its lamp colors and its control guide, for a cabinet with
# LED-lit controls (the cabinet's own leds.cfg wins where it has lines for
# beanrush). See the VectorPie SDK's docs/07-packages.md.

beanrush/color_map[p1_joystick1] #FF3CC8
beanrush/color_map[p1_button1]   #00FF40
beanrush/color_map[p1_button2]   #FFC000

beanrush/voice_map[p1_joystick1] move
beanrush/voice_map[p1_button1]   jump
beanrush/voice_map[p1_button2]   dive
